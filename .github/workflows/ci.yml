name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    uses: toreau/gh-workflows/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: Astronomy.slnx
      global-json-file: global.json
      coverage: true
      upload-artifacts: true

  builder:
    needs: build-test
    if: github.ref == 'refs/heads/main' && needs.build-test.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: toreau/gh-workflows/.github/workflows/container-build-attest.yml@373df7517487bd20ac55a0986926677c0ddcbcf6

  dispatch:
    needs: builder
    if: github.ref == 'refs/heads/main' && needs.builder.result == 'success'
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@v1
    with:
      target-repo: toreau/k8s-research
      event-type: app-image-pushed
      payload: '{"app":"astronomy","sha":"${{ github.sha }}","digest":"${{ needs.builder.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
      hmac-secret: ${{ secrets.DISPATCH_HMAC_KEY }}
