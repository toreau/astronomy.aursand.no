name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    uses: toreau/gh-workflows/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: Astronomy.slnx
      global-json-file: global.json
      coverage: true
      upload-artifacts: true

  docker:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: toreau/gh-workflows/.github/workflows/container-build-push.yml@v1
    with:
      image: ghcr.io/toreau/astronomy-api
      dockerfile: src/Astronomy.Api/Dockerfile
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      tags: |
        ghcr.io/toreau/astronomy-api:main-${{ github.sha }}
        ghcr.io/toreau/astronomy-api:latest
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "ghcr.io/toreau/astronomy-api:main-${{ github.sha }}" --format '{{.Manifest.Digest}}')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "resolved $d"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/toreau/astronomy-api:main-${{ github.sha }}
          format: spdx-json
          output-file: report.spdx.json
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ghcr.io/toreau/astronomy-api
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4
        with:
          subject-name: ghcr.io/toreau/astronomy-api
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: report.spdx.json
          push-to-registry: true
      - name: Verify attestations (fail-fast)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          # Attestations are created in this repo's own workflow, so the default
          # signer identity matches (no --signer-workflow needed).
          for i in 1 2 3 4 5; do
            gh attestation verify "oci://ghcr.io/toreau/astronomy-api@${DIGEST}" -R toreau/astronomy.aursand.no \
              --predicate-type https://slsa.dev/provenance/v1 \
              && { echo "SLSA provenance verified"; break; }
            [ "$i" -lt 5 ] && sleep 5
          done
          gh attestation verify "oci://ghcr.io/toreau/astronomy-api@${DIGEST}" -R toreau/astronomy.aursand.no \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "attestations verified for ${DIGEST}"

  dispatch:
    needs: attest
    if: github.ref == 'refs/heads/main'
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@v1
    with:
      target-repo: toreau/k8s-research
      event-type: astro-image-pushed
      payload: '{"sha":"${{ github.sha }}","digest":"${{ needs.attest.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
