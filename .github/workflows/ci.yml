name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    uses: toreau/gh-workflows/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: Astronomy.slnx
      global-json-file: global.json
      coverage: true
      upload-artifacts: true

  docker:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    uses: toreau/gh-workflows/.github/workflows/container-build-push.yml@v1
    with:
      image: ghcr.io/toreau/astronomy-api
      dockerfile: src/Astronomy.Api/Dockerfile
      platform: linux/${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tags: |
        ghcr.io/toreau/astronomy-api:main-${{ github.sha }}-${{ matrix.arch }}
        ghcr.io/toreau/astronomy-api:latest-${{ matrix.arch }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    needs: docker
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: toreau/gh-workflows/.github/workflows/container-merge-attest.yml@v1
    with:
      image: ghcr.io/toreau/astronomy-api
      per-arch-tags: |
        ghcr.io/toreau/astronomy-api:main-${{ github.sha }}-amd64
        ghcr.io/toreau/astronomy-api:main-${{ github.sha }}-arm64
      merge-tags: |
        ghcr.io/toreau/astronomy-api:main-${{ github.sha }}
        ghcr.io/toreau/astronomy-api:latest
      attestation-repo: toreau/astronomy.aursand.no
      sbom-image: ghcr.io/toreau/astronomy-api:main-${{ github.sha }}-amd64
      sbom: true
      verify: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  dispatch:
    needs: merge
    if: github.ref == 'refs/heads/main'
    uses: toreau/gh-workflows/.github/workflows/dispatch.yml@v1
    with:
      target-repo: toreau/k8s-research
      event-type: astro-image-pushed
      payload: '{"sha":"${{ github.sha }}","digest":"${{ needs.merge.outputs.digest }}"}'
    secrets:
      token: ${{ secrets.K8S_RESEARCH_PAT }}
