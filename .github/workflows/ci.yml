name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Astronomy.slnx
      - run: dotnet build Astronomy.slnx -c Release --no-restore
      - run: dotnet test Astronomy.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage-results
      - name: Summarize coverage
        run: |
          echo "Coverage per project (line rate):"
          for f in coverage-results/*/coverage.cobertura.xml; do
            [ -f "$f" ] || continue
            echo "  $(basename "$(dirname "$f")"): $(grep -o 'line-rate="[^"]*"' "$f" | head -1 | cut -d'"' -f2)"
          done
          true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage-results/**/coverage.cobertura.xml
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Astronomy.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/toreau/astronomy-api:main-${{ github.sha }}
            ghcr.io/toreau/astronomy-api:latest
