name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Astronomy.slnx
      - run: dotnet build Astronomy.slnx -c Release --no-restore
      - run: dotnet test Astronomy.slnx -c Release --no-build
