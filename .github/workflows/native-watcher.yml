name: native-watcher
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    uses: toreau/gh-workflows/.github/workflows/native-pin-watcher.yml@19c65c9683f649cab7d3831a3bbc66451e756ebe
    with:
      dockerfile: src/Astronomy.Api/Dockerfile
      issue-title: "Native dependency update available (erfa/cspice)"
      pins: >-
        [
          {"name":"erfa","type":"tag","pattern":"--branch (v[0-9.]+)","group":1,"upstream":"liberfa/erfa"},
          {"name":"cspice","type":"commit","pattern":"origin ([0-9a-f]{40})","group":1,"upstream":"arturania/cspice"}
        ]
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
