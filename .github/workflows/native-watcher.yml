name: native-watcher
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    uses: toreau/gh-workflows/.github/workflows/native-pin-watcher.yml@v1
    with:
      dockerfile: src/Astronomy.Api/Dockerfile
      issue-title: "Native dependency update available (erfa/cspice)"
      pins: >-
        [
          {"name":"erfa","type":"tag","pattern":"--branch v[0-9.]+","extract":"s/--branch //","upstream":"liberfa/erfa"},
          {"name":"cspice","type":"commit","pattern":"origin [0-9a-f]{40}","extract":"s/origin //","upstream":"arturania/cspice"}
        ]
